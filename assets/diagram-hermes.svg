    <circle cx="24" cy="6" r="5" fill="#e5c07b"/>
    <circle cx="42" cy="6" r="5" fill="#98c379"/>
    <text x="64" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#888880" letter-spacing="1">STACK: HERMES 2 PRO + 9ROUTER + TELEGRAM BOT</text>
    <rect x="740" y="-3" width="148" height="20" rx="10" fill="rgba(109, 138, 34, 0.2)" stroke="#6d8a22" stroke-width="1"/>
