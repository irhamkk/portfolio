  <!-- Code Snippet Window -->
  <g transform="translate(36, 214)">
    <rect width="888" height="286" rx="10" fill="#131311" stroke="#2a2a26" stroke-width="1"/>
    
    <rect width="888" height="34" rx="10" fill="#1a1a17"/>
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#787870">python — analyst_bot.py — Telegram Warehouse Bot</text>
    <rect x="745" y="7" width="123" height="20" rx="4" fill="#252520"/>
    <text x="755" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e5c07b">SQLITE SYNCED</text>

    <g transform="translate(24, 60)" font-family="'JetBrains Mono', monospace" font-size="12" line-height="1.7">
      <text y="0" fill="#c678dd">@bot.message_handler<tspan fill="#abb2bf">(commands=[</tspan><tspan fill="#98c379">'rekap_hari_ini'</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">'stok_warning'</tspan><tspan fill="#abb2bf">])</tspan></text>
      <text y="24" fill="#c678dd">def <tspan fill="#61afef">handle_warehouse_analytics</tspan><tspan fill="#abb2bf">(message):</tspan></text>
      <text y="48" fill="#abb2bf">    metrics = db.calculate_daily_summary(date.today())</text>
      <text y="72" fill="#abb2bf">    low_stock_items = db.filter_items(threshold=20)</text>
      <text y="96" fill="#5c6370">    # Automated formatting for instant team mobile visibility</text>
      <text y="120" fill="#abb2bf">    summary_card = f"""</text>
      <text y="144" fill="#98c379">    📦 [REKAP GUDANG] Total Pesanan: {metrics.total_orders} ({metrics.status_ready} Siap Kirim)</text>
      <text y="168" fill="#e06c75">    ⚠️ PERINGATAN STOK MENIPIS: {len(low_stock_items)} SKU di bawah batas minimum</text>
      <text y="192" fill="#abb2bf">    """</text>
      <text y="216" fill="#61afef">    bot.send_message<tspan fill="#abb2bf">(chat_id=message.chat.id, text=summary_card, parse_mode=</tspan><tspan fill="#98c379">'Markdown'</tspan><tspan fill="#abb2bf">)</tspan></text>
    </g>
  </g>
</svg>
