  <rect width="960" height="540" rx="14" fill="url(#bgGrad3)"/>
  <rect width="958" height="538" x="1" y="1" rx="13" fill="none" stroke="#2e2e2a" stroke-width="1.5"/>

  <!-- Top Bar -->
